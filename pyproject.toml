[project]
name = "towerDocs"
version = "0.1.0"
description = "An AI agentic document-processing platform on Azure"
readme = "README.md"
authors = [
    { name = "Rihab Al-Yasiri", email = "rihab.al-yasiri@web.de" }
]
requires-python = ">=3.14"
dependencies = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
]

[project.scripts]
towerdocs = "towerdocs:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
